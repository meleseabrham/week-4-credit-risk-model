name: CI/CD Pipeline

on:
  push:
    branches: [ main, task-* ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # Stop build on syntax errors or undefined names
          python -m flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat other issues as warnings
          python -m flake8 src/ tests/ --count --max-line-length=88 --statistics

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          python -m pytest tests/ --cov=src --cov-report=term --cov-report=html

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        run: |
          docker build -t credit-risk-api:test -f Dockerfile .

      - name: Build Dashboard Docker image
        run: |
          docker build -t credit-risk-dashboard:test -f Dockerfile.streamlit .

      - name: Test Docker Compose
        run: |
          docker-compose config
